name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # 3.10 is not a supported target: pyproject declares
        # requires-python = ">=3.11", so that leg failed at pip install,
        # in 13 seconds, on every run.
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      - name: Run pytest test suite
        run: |
          pytest --durations=10

      - name: Run pre-tag release gate verification
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python tools/release_check.py --no-tests
