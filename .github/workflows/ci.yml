name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # release.yml calls this workflow on the tagged commit and publishes to PyPI
  # only if every job here passes. Keep it free of event-specific conditions
  # (inside a call, github.event_name is the caller's "push" of a tag).
  workflow_call:

env:
  PYTHONFAULTHANDLER: "1"
  PUREMACRO_LLM_MODE: "cache"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # 3.10 is not a supported target: pyproject declares
        # requires-python = ">=3.11", so that leg failed at pip install,
        # in 13 seconds, on every run.
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      # Exercise the portable format before the long numerical suite: ZIP
      # container headers differ between Windows and Unix even when the
      # stored arrays are identical.
      - name: Verify portable cartridge compatibility
        run: pytest tests/test_runtime_store_attrs.py -q

      # Check floating-point parity across income-batch boundaries and the
      # explicit-grid path before the long numerical suite on every platform.
      - name: Verify sovereign grid compatibility
        run: pytest tests/test_sovereign/test_monotone_search.py tests/test_sovereign/test_custom_debt_grid.py tests/test_sovereign/test_bit_identity.py -q

      # The 3.11 leg resolves NumPy 2.4 (NumPy 2.5 requires Python 3.12), whose
      # stubs differ from 2.5's; v5.4.0 failed typing only there. Check both.
      - name: Run static type checking (mypy)
        if: matrix.os == 'ubuntu-latest' && (matrix.python-version == '3.11' || matrix.python-version == '3.12')
        run: |
          mypy puremacro --ignore-missing-imports
          mypy puremacro --ignore-missing-imports --platform win32 --no-incremental

      # On 3.11 (the requires-python floor) Gate 7 is the interpreter's own
      # parser; on 3.12 it is the PEP 701 f-string scan. Running both keeps
      # the scan honest against the real thing.
      - name: Run pre-tag release gate verification
        if: matrix.os == 'ubuntu-latest' && (matrix.python-version == '3.11' || matrix.python-version == '3.12')
        run: |
          python tools/release_check.py --no-tests

      - name: Run pytest test suite
        env:
          # Shared runners are several times slower than the machines the
          # wall-clock budgets were written on; see tests/_timing.py.
          # 5 was exceeded once on windows/3.11 (0.53 s against 0.5 s).
          PUREMACRO_TIMING_SCALE: "10"
          PYTHONFAULTHANDLER: "1"
          PUREMACRO_LLM_MODE: "cache"
        run: |
          pytest --durations=10

      # The docs site is built nowhere else: pages.yml deploys only the
      # JupyterLite playground. Without this step mkdocs.yml rots silently --
      # it accumulated five nav entries pointing at files that do not exist,
      # and `--strict` turns exactly that warning into a failure.
      - name: Build the documentation site (strict)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pip install mkdocs-material
          mkdocs build --strict --site-dir /tmp/site

  installed-examples:
    name: Examples from installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheel and exercise clean installation
        run: |
          python -m pip install build
          python -m build --wheel
          python tools/check_installed_examples.py dist/*.whl
