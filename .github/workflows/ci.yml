name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # release.yml calls this workflow on the tagged commit and publishes to PyPI
  # only if every job here passes. Keep it free of event-specific conditions
  # (inside a call, github.event_name is the caller's "push" of a tag).
  workflow_call:

# A new commit on a pull request cancels that pull request's run still in
# progress. Every other run (a push to main, the release call) gets a group of
# its own, its run id, so it never cancels anything and is never cancelled.
# This is the one event-specific condition, and a release call falls on the
# safe side of it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONFAULTHANDLER: "1"
  PUREMACRO_LLM_MODE: "cache"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # 3.10 is not a supported target: pyproject declares
        # requires-python = ">=3.11", so that leg failed at pip install,
        # in 13 seconds, on every run.
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      # Exercise the portable format before the long numerical suite: ZIP
      # container headers differ between Windows and Unix even when the
      # stored arrays are identical.
      - name: Verify portable cartridge compatibility
        run: pytest tests/test_runtime_store_attrs.py -q

      # Check floating-point parity across income-batch boundaries and the
      # explicit-grid path before the long numerical suite on every platform.
      - name: Verify sovereign grid compatibility
        run: pytest tests/test_sovereign/test_monotone_search.py tests/test_sovereign/test_custom_debt_grid.py tests/test_sovereign/test_bit_identity.py tests/test_examples/test_first_brief_sovereign.py::test_build_record_schema_and_recomputation -q

      # -n auto: one pytest-xdist worker per core (4 on the Linux and Windows
      # runners, 3 on macOS). --dist loadfile: each test file runs whole in
      # one worker, so module state and fixtures behave as in a serial run.
      # --no-loadscope-reorder: files start in collection order, and
      # tests/conftest.py (_HEAVY_FIRST) puts the slowest files first. Run
      # serially, one leg spent about 122 of its 128 minutes in this step.
      - name: Run pytest test suite
        env:
          # Shared runners are several times slower than the machines the
          # wall-clock budgets were written on; see tests/_timing.py.
          # 5 was exceeded once on windows/3.11 (0.53 s against 0.5 s).
          PUREMACRO_TIMING_SCALE: "10"
          PYTHONFAULTHANDLER: "1"
          PUREMACRO_LLM_MODE: "cache"
          # One BLAS/OpenMP thread per worker: -n auto already starts one
          # worker per core, and four workers running four BLAS threads each
          # only compete for the same cores.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          pytest -n auto --dist loadfile --no-loadscope-reorder --durations=25

  # Type checks, the release gate and the docs build run beside the test legs
  # instead of inside the Ubuntu ones, where they added about 4 minutes to the
  # longest leg.
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"

      # The 3.11 leg resolves NumPy 2.4 (NumPy 2.5 requires Python 3.12), whose
      # stubs differ from 2.5's; v5.4.0 failed typing only there. Check both.
      - name: Run static type checking (mypy)
        run: |
          mypy puremacro --ignore-missing-imports
          mypy puremacro --ignore-missing-imports --platform win32 --no-incremental

      # On 3.11 (the requires-python floor) Gate 7 is the interpreter's own
      # parser; on 3.12 it is the PEP 701 f-string scan. Running both keeps
      # the scan honest against the real thing.
      - name: Run pre-tag release gate verification
        run: |
          python tools/release_check.py --no-tests

      # The docs site is built nowhere else: pages.yml deploys only the
      # JupyterLite playground. Without this step mkdocs.yml rots silently --
      # it accumulated five nav entries pointing at files that do not exist,
      # and `--strict` turns exactly that warning into a failure.
      - name: Build the documentation site (strict)
        if: matrix.python-version == '3.12'
        run: |
          pip install mkdocs-material
          mkdocs build --strict --site-dir /tmp/site

  installed-examples:
    name: Examples from installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheel and exercise clean installation
        run: |
          python -m pip install build
          python -m build --wheel
          python tools/check_installed_examples.py dist/*.whl

  min-dependency-floor:
    name: Minimum Dependency Floor (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install minimum dependency floor
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.0" "scipy==1.10.0" "pandas==2.0.0" "matplotlib==3.7.0" "requests==2.31.0"
          pip install -e ".[dev]"
          pip install "numpy==1.26.0" "scipy==1.10.0" "pandas==2.0.0" "matplotlib==3.7.0" "requests==2.31.0"
      - name: Verify installed dependency floor versions
        run: |
          python -c "import numpy, scipy, pandas, matplotlib, requests; print('numpy:', numpy.__version__); print('scipy:', scipy.__version__); print('pandas:', pandas.__version__); print('matplotlib:', matplotlib.__version__); print('requests:', requests.__version__)"
      - name: Run test suite on minimum dependency floor
        env:
          PUREMACRO_TIMING_SCALE: "10"
          PYTHONFAULTHANDLER: "1"
          PUREMACRO_LLM_MODE: "cache"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python -m pytest tests/test_lp/ tests/test_conformance/ tests/test_research_benchmarks.py -q
