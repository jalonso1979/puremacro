name: Deploy Playground & Docs to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[notebooks]"
          # Pinned deliberately. `jupyterlite-xeus-python` (1.0.0) used to sit here:
          # it caps jupyterlite-core at 0.2.3, so pip backtracked off the 0.8.x it had
          # just downloaded and every Pages build since 2026-08-16 died in
          # `build:lite:patch:content/jupyter-lite.json`. The playground runs the
          # Pyodide kernel and never xeus, so that cap bought nothing. On core >= 0.8
          # the pyodide kernel is a separate package, and jupyter-server is required
          # to copy `--contents` at all.
          pip install "jupyterlite-core==0.8.3" "jupyterlite-pyodide-kernel==0.8.4" \
                      jupyter-server mkdocs-material

      - name: Build JupyterLite Playground
        run: |
          bash playground/build_playground.sh
          touch playground/dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playground/dist
          publish_branch: gh-pages
          force_orphan: true
