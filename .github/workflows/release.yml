name: Release to PyPI

# Tag-triggered publish to PyPI via Trusted Publishing (OIDC — no API token).
# For the SPLIT puremacro repo (puremacro/ as root). Before this works you must,
# on PyPI, create the `puremacro` project and add a Trusted Publisher for:
#   owner/repo = <you>/puremacro, workflow = release.yml, environment = pypi.
# Then: git tag v0.92.0 && git push --tags

on:
  push:
    tags: ['v*']

jobs:
  # The full CI matrix (ci.yml, via workflow_call) on the exact tagged commit.
  # Publishing waits for it and for the opt-in job: a red suite never reaches PyPI. The publish job
  # below stays in this file, so the Trusted Publisher (workflow = release.yml,
  # environment = pypi) is unchanged; do not rename this file or move that job.
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml

  # The opt-in markers (slow, reference, replication) on the tagged commit:
  # the frozen goldens they guard are exactly what a release must not ship
  # red. Its notebook-execution job skips itself inside a call (see the
  # `if:` there), so this adds roughly an hour, not three.
  opt-in:
    name: Opt-in tests on the tagged commit
    uses: ./.github/workflows/opt-in-tests.yml

  build-and-publish:
    name: build + publish (PyPI trusted publishing)
    needs: [ci, opt-in]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
