name: Release to PyPI

# Tag-triggered publish to PyPI via Trusted Publishing (OIDC — no API token).
# For the SPLIT puremacro repo (puremacro/ as root). Before this works you must,
# on PyPI, create the `puremacro` project and add a Trusted Publisher for:
#   owner/repo = <you>/puremacro, workflow = release.yml, environment = pypi.
# Then: git tag v0.92.0 && git push --tags

on:
  push:
    tags: ['v*']

jobs:
  build-and-publish:
    name: build + publish (PyPI trusted publishing)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-runs on an already-published version return 200 instead of a
          # 400 "File already exists" red-X (the benign v0.92.0 failure mode).
          skip-existing: true
