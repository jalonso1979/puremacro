site_name: puremacro
site_description: Production-grade Macroeconometric and Heterogeneous-Agent Structural Modeling Engine in Pure Python
site_author: puremacro contributors
site_url: https://jalonso1979.github.io/puremacro/

repo_name: jalonso1979/puremacro
repo_url: https://github.com/jalonso1979/puremacro

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - tables

nav:
  - English Documentation:
      - Overview: index.md
      - Quickstart: quickstart.md
      - Correctness advisories: ADVISORY.md
      - Data:
          - Quarterly National Accounts: national_accounts.md
          - Real-time data (vintages): real_time_data.md
          - Long national accounts panel: long_panel.md
      - Econometric Engines:
          - VAR & FAVAR: var.md
          - Narrative Sign Restrictions SVAR: narrative_sign_svar.md
          - BVAR with Stochastic Volatility: bvar_sv.md
          - Local Projections: lp.md
          - Smooth Local Projections: smooth_lp.md
          - Modern Difference-in-Differences: did.md
          - Honest DiD Sensitivity: honest_did.md
          - GDP Nowcasting: nowcast.md
          - Penalized Forecasting: forecast.md
      - Publication & Reporting:
          - Manuscript Tables & Exports: reporting.md
      - Structural Models:
          - Sequence-Space HANK: models.md
          - Non-Linear HANK Transitions: hank_nonlinear.md
          - Gertler-Karadi (2011) DSGE: gertler_karadi.md
          - Climate Macro (DICE): climate.md
          - DSGE Sketchpad & Dynare: dsge_build.md
      - Running Anywhere (iPad / browser): tablet.md
      - Performance & Benchmarks: benchmarks.md
      - Reference:
          - Validation & goldens: VALIDATION.md
          - Connector health: CONNECTOR_HEALTH.md
          - Credentials: CREDENTIALS.md
          - Cache database: CACHE_DB.md
          - Signal contract: SIGNAL_CONTRACT.md
          - Examples gallery: examples_gallery.md
          - Lexicon review: lexicon_review.md
          - Path to 1.0: 1.0_path.md
