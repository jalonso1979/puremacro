site_name: puremacro
site_description: Production-grade Macroeconometric and Heterogeneous-Agent Structural Modeling Engine in Pure Python
site_author: puremacro contributors
site_url: https://jalonso1979.github.io/puremacro/

repo_name: jalonso1979/puremacro
repo_url: https://github.com/jalonso1979/puremacro

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - tables

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Correctness advisories: ADVISORY.md
  - Data:
      - Quarterly National Accounts: national_accounts.md
      - Real-time data (vintages): real_time_data.md
      - Long national accounts panel: long_panel.md
  - Econometric Engines:
      - VAR & FAVAR: var.md
      - GDP Nowcasting: nowcast.md
      - Penalized Forecasting: forecast.md
  - Structural Models:
      - Sequence-Space HANK: models.md
      - Climate Macro (DICE): climate.md
      - DSGE Sketchpad: dsge_build.md
  - Running Anywhere (iPad / browser): tablet.md
  - Performance & Benchmarks: benchmarks.md
  # These pages existed on disk and were unreachable from the nav, so the site
  # rendered without them and nothing said so. `mkdocs build --strict` in CI
  # (see .github/workflows/ci.yml) now fails on a nav entry with no file; it
  # cannot catch a file with no nav entry, so keep this list in sync by hand.
  - Reference:
      - Validation & goldens: VALIDATION.md
      - Connector health: CONNECTOR_HEALTH.md
      - Credentials: CREDENTIALS.md
      - Cache database: CACHE_DB.md
      - Signal contract: SIGNAL_CONTRACT.md
      - Examples gallery: examples_gallery.md
      - Lexicon review: lexicon_review.md
      - Path to 1.0: 1.0_path.md
